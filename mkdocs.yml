site_name: InfoVis
site_description: Technical and development documentation for the InfoVis Blender add-on
repo_name: InfoVis
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
nav:
  - Home:
      - Overview: index.md
      - User Guide: guides/GUIA_DE_UTILIZACAO.md
      - LI Mapping Guide: guides/LI_MAPPING_GUIDE.md
      - Architecture: ARCHITECTURE.md
      - Development: DEVELOPMENT.md
  - Technical Reference:
      - Operators: guides/OPERATORS_DOCUMENTATION.md
      - Panels: guides/PANELS_DOCUMENTATION.md
      - Properties: guides/PROPERTIES_DOCUMENTATION.md
      - Data: guides/DATA_DOCUMENTATION.md
  - Reference:
      - Glossary: reference/GLOSSARY.md
  - Extras:
      - Executive Summary: extra/SUMARIO_EXECUTIVO.md
      - Next Steps: extra/PROXIMOS_PASSOS.md
      - Documentation Completed: extra/DOCUMENTACAO_CONCLUIDA.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
